<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, inital-scale=1.0" name="viewport">
</head>
<body>
    <table border="1px">
        <thead>
            <tr>
                <th>STT</th>
                <th>Sản phẩm</th>
                <th>Đơn giá</th>
                <th>Số lượng</th>
                <th>Thành tiền</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td> 
                <td>HP Victus 15</td> 
                <td>15,000,000 vnd</td> 
                <td>1</td> 
                <td>15,000,000 vnd</td> 
            </tr>
            <tr>
                <td>2</td> 
                <td>Màn hình 4k 120hz</td> 
                <td>6,000,000 vnd</td> 
                <td>2</td> 
                <td>12,000,000 vnd</td> 
            </tr>
            <tr>
                <td>3</td> 
                <td>Bàn phím không dây</td> 
                <td>1,000,000 vnd</td> 
                <td>1</td> 
                <td>1,000,000 vnd</td> 
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td>Tổng cộng</td>
                <td colspan="4">28,000,000 vnd</td>
            </tr>
        </tfoot>
    </table>
    <form action="#" method="post">
        <fieldset>
            <legend>Thanh toán</legend>
            <p>Phương thức thanh toán</p>
            <input type="radio" id="1" name="Phương thức thanh toán" value="COD">
            <label for="COD">COD</label>
            <input type="radio" id="2" name="Phương thức thanh toán" value="Chuyển khoản">
            <label for="Chuyển khoản">Chuyển khoản</label>
            <input type="radio" id="3" name="Phương thức thanh toán" value="Ví điện tử">
            <label for="Ví điện tử">Ví điện tử</label>
            <div>
            <label for="Mã giảm giá">Mã giảm giá</label>
            <input type="text" id="Mã giảm giá" name="Mã giảm giá" title="VD:SALE1234" pattern="(?=.*SALE)(?=.*\d).{8}" required>
            </div>
            <label for="Ghi chú ">Ghi chú</label>
            <textarea id="Ghi chú" name="Ghi chú" rows="3" placeholder="Nhập ghi chú ở đây"></textarea>
        </fieldset>
        <fieldset>
            <legend>Thông tin giao hàng</legend>
            <label for="Ngày giao">Ngày giao mong muốn</label>
            <input id="Ngày giao" name="Ngày giao" type="date" min="2026-4-30" required>
            <select required>
                <option>Sáng 8-12h</option>
                <option>Chiều 14-18h</option>
                <option>Tối 18-21h</option>
            </select>
            <label for="Thời gian giao hàng"></label>
            <input id="Thời gian giao" name="Thời gian giao" type="range" min="1"max="7" step="1" >
            <button aria-label="Xác nhận đặt hàng" type="submit">Xác nhận đặt hàng</button>
        </fieldset>
    </form>
</body>
