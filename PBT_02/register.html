<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản E-Commerce</title>
</head>
<body>
    <form action="#" method="post">
        <fieldset>
            <legend>Thông tin cá nhân</legend>
            <div>
                <label for="hoten">Họ tên:</label>
                <input type="text" id="hoten" required minlength="2" maxlength="50" placeholder="Tạ Viết A">
            </div>
            <div>
                <label for="email">Email:</label>
                <input type="email" id="email" required placeholder="abc@gmail.com">
            </div>
            <div>
                <label for="tel">Số điện thoại:</label>
                <input type="tel" id="tel" pattern="[0-9]{10}" placeholder="0123456789" required>
            </div>
            <div>
                <label for="birthday">Ngày sinh:</label>
                <input type="date" id="birthday" max="2026-04-29" required>
            </div>
        </fieldset>

        <fieldset>
            <legend>Tài khoản</legend>
            <div>
                <label for="username">Username:</label>
                <input type="text" id="username" pattern="[A-Za-z0-9_]{3,20}" placeholder="user_123" required>
            </div>
            <div>
                <label for="password">Password:</label>
                <input type="password" id="password" minlength="8" pattern="(?=.*\d)(?=.*[A-Z]).*" placeholder="Ít nhất 1 chữ hoa, 1 số" required>
            </div>
            <div>
                <label for="confirm_password">Confirm password:</label>
                <input type="password" id="confirm_password" minlength="8" pattern="(?=.*\d)(?=.*[A-Z]).*" placeholder="Nhập lại mật khẩu" required>
            </div>
        </fieldset>

        <fieldset>
            <legend>Thông tin giao hàng</legend>
            <label for="city">Thành phố:</label>
            <select id="city" name="city" required>
                <option value="" disabled selected>-- Chọn thành phố --</option>
                <option value="hanoi">Hà Nội</option>
                <option value="hcm">TP. Hồ Chí Minh</option>
                <option value="danang">Đà Nẵng</option>
                <option value="haiphong">Hải Phòng</option>
                <option value="cantho">Cần Thơ</option>
            </select>

            <label for="district">Quận huyện:</label>
            <select id="district" name="district" required>
                <option value="" disabled selected>-- Chọn quận huyện --</option>
                <option value="dong-da">Đống Đa</option>
                <option value="my-duc">Mỹ Đức</option>
            </select>

            <div>
                <label for="address">Chi tiết địa chỉ:</label>
                <textarea id="address" rows="3" placeholder="Số nhà, tên đường..."></textarea>
            </div>

            <p>Giới tính:</p>
            <input type="radio" id="male" name="gender" value="nam">
            <label for="male">Nam</label>
            <input type="radio" id="female" name="gender" value="nu">
            <label for="female">Nữ</label>
            <input type="radio" id="other" name="gender" value="khac">
            <label for="other">Khác</label>
        </fieldset>

        <div>
            <input type="checkbox" id="agree" required>
            <label for="agree">Tôi đồng ý với điều khoản sử dụng</label>
        </div>

        <button type="submit" title="Xác nhận">Xác nhận</button>
        <button type="reset" title="Hủy">Hủy</button>
    </form>
</body>
</html>
