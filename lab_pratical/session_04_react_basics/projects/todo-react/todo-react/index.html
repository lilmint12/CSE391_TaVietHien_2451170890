<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>hello-react</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body class="bg-light">
  <div id="root">

    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">

          <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
              <h4 class="mb-0">Todo App</h4>
            </div>

            <div class="card-body">

              <!-- Todo Form Component -->
              <form id="todoForm" class="d-flex gap-2 mb-4">
                <input type="text" id="todoInput" class="form-control" placeholder="Nhập công việc..." />
                <button type="submit" class="btn btn-primary">
                  Thêm
                </button>
              </form>

              <!-- Todo Stats Component -->
              <div class="alert alert-info py-2">
                Tổng số công việc:
                <strong id="todoCount">0</strong>
              </div>

              <!-- Todo List Component -->
              <ul id="todoList" class="list-group">
                <!-- Todo Item sẽ được render bằng JavaScript -->
              </ul>

            </div>
          </div>

        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
